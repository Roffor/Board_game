id: shchit-very
imya: Щит веры
geroj: zhrec
nabor: start
vid: защита
kopij: 2
chisla:
  shchit: 3
  shchit_big: 5
  doplata: 2
tekst: '{shchit:щит} себе или союзнику. Доплата {doplata:веру}: {shchit_big}.'
varianty:
- nazvanie: себе
  effekt:
  - {shchit: {komu: ja, n: shchit}}
- nazvanie: себе с доплатой
  doplata: {vera: 2}
  effekt:
  - {shchit: {komu: ja, n: shchit_big if oplacheno else shchit}}
- nazvanie: союзнику
  effekt:
  - {shchit: {komu: soyuznik, n: shchit}}
- nazvanie: союзнику с доплатой
  doplata: {vera: 2}
  effekt:
  - {shchit: {komu: soyuznik, n: shchit_big if oplacheno else shchit}}
bot: {poryadok: 4, cennost: 5}
granicy: {shchit: [1, 5], shchit_big: [3, 7], doplata: [0, 4]}
status: prinyata
staryj_id: z_fshield
istoriya:
- перенос из старого симулятора (числа итоговые на 01.10)
