id: shepot-kostra
imya: Шёпот костра
geroj: mag
nabor: start
vid: двигатель
cena: 0
podnoshenie: 1
chisla:
  dobor: 1
  mana: 1
tekst: '{cena:мана}. Возьми {dobor:карту} ИЛИ верни 1 сожжённую карту в руку. Подношение: +{mana:мана}.'
varianty:
- nazvanie: возьми
  effekt:
  - {dobor: dobor}
  - {mana: mana * podnoshenie}
- nazvanie: верни
  effekt:
  - {verni: {n: 1}}
  - {mana: mana * podnoshenie}
bot: {poryadok: 2, cennost: 3, pereplan: true, mana_v_plane: 1}
granicy: {dobor: [0, 3], mana: [0, 3], cena: [0, 1]}
status: prinyata
staryj_id: whisper
istoriya:
- перенос из старого симулятора (числа итоговые на 01.10)
