# Общие числа правил боя. Пороги соглашения по балансу — в soglashenie.yaml.
# Агент может менять числа здесь только в границах, которые разрешил план.

ruka: 6                    # в начале раунда герои добирают руку до 6 карт
mana_maga: 3               # мана мага в начале раунда
limit_kart_zhreca: 3       # Жрец играет до 3 карт из руки за ход
vera_maks: 6               # вера Жреца 0–6
molitva_otkryt: 2          # Молитва: открой 2 верхние карты, одну сыграй бесплатно
blagoslovenie: 3           # Благословение снимает 3 урона со следующего удара по союзнику
blagoslovenie_bolshoe: 5   # Небесный доспех: в этом раунде Благословение снимает 5
zaslon_do_ataki: 1         # Никита 2026-10-26: Заслон одноразовый — снимается в конце раунда, если враг атаковал; не атаковал — остаётся (0 — висит до удара)
zaslon_shipy: 3            # Никита 2026-10-26: Заслон — шипы: герой под Заслоном принял удар, враг получает столько урона (0 — старый Заслон, ослабляет удар); значение подбирается тестом
pokrov_bonus: 1            # Карающий покров: попадания благословлённого союзника +1
steklo_mnozhitel: 3        # Стеклянный огонь: следующее попадание мага ×3
bdenie_porog: 4            # Бдение: если в конце раунда вера 4+, в начале следующего возьми 1 карту
blagaya_vest_kart: 3       # Благая весть: если союзник сыграет 3+ карты...
blagaya_vest_vera: 2       # ...+2 веры
vdohnovenie_vera: 3        # Вдохновение: если союзник сыграет взятую карту, +3 веры
maslo_na_starte: 6         # масло фонаря в начале боя (0 — Темнота: намерения скрыты)
vspyshka: 0                # Вспышка фонаря (−1 к удару врага за масло); 0 — выключена на тренажёре (2026-10-26), для Катакомб вернуть 1
maslo_maks: 6
predel_raundov: 25         # защита от бесконечного боя: на 26-м раунде бой засчитан поражением

# Новые правила мага (Никита 2026-10-24). Включаются сами, если в колоде мага есть карты банка или легендарка;
# 1 — включить и для обычных колод. Подробно: playtest/stend/engine/mag2.py
mag_pravila_2026_10_24: 0
porcha_sila: 1             # Порча-индикатор: каждое попадание по врагу с Порчей +1 (2026-10-26 Никита: было +2), снимается в конце раунда
porcha_zheton: 1           # легендарка «Глубокий сглаз»: +1 к попаданию за каждый жетон Порчи
porcha_maks_zhetonov: 2   # 2026-10-27 Никита 2А: Глубокий сглаз, предел 3 → 2 (26.10 было 6 → 3)

# Подземелье для боёв стенда: только враги и комнаты из dungeons/<имя>/ (пусто — все). 2026-10-25: тренажёр для подгонки карт.
podzemelye: trenazher

# Что пара знает об ударе скрытого врага (оценка при планировании)
skrytoe_namerenie: {I: 4, II: 5, EL: 6, BOSS: 7}

# Подсказки бота о ценности будущих эффектов (в копии для планирования). Это настройка бота, не игры.
bot:
  ocenka_molitvy: 4.0          # сколько стоит одна будущая Молитва
  ocenka_molitvy_v_limit: 1.5
  ocenka_obeta: 0.45
  # веса оценки плана бота (stend/bot.py evaluate); подбираются на этапе 1 подгонки 2026-10-25 («учу бота»)
  ves_ubijstva: 12             # бонус за убийство врага в этом раунде
  ves_zaslona: 1.5             # герой под Заслоном в конце раунда
  ves_very: 0.6                # за каждую веру Паладина сверх начала раунда
  ves_ruki: 0.0                # за каждую карту в руке сверх начала раунда (добор и удержание)
  ves_sozhzhennoj: 0.6         # штраф за каждую карту мага, ушедшую в зону сожжённых
  ves_podnosheniya: 1.8        # за жетон Подношения
  ves_dolga: 1.6               # штраф за жетон долга духам

# Дотест 2026-10-26 (не правило игры): «ярость» — с раунда yarost_raund враг яруса бьёт на N сильнее; 0 — выключено
yarost: {I: 0, II: 0, EL: 0, BOSS: 0}
yarost_raund: 5
