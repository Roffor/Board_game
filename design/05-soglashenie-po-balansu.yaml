# Пороги соглашения по балансу в машинном виде. Источник правды — design/05-soglashenie-po-balansu.md.
# АГЕНТУ ТОЛЬКО ЧИТАТЬ. Меняется только по согласованию с Никитой.
# Коридоры проверяются по среднему в группе боёв (ситуации I, II, EL, BOSS).

raundy:                      # [С 2.1–2.4] раундов в среднем
  I: [3.5, 4.0]
  II: [3.0, 3.5]
  EL: [4.0, 6.0]
  BOSS: [5.0, 8.0]

zatyazhnye:                  # [С 2.5] доля слишком долгих боёв
  I: {dolshe: 5, dolya_maks: 0.10}
  II: {dolshe: 5, dolya_maks: 0.10}
  EL: {dolshe: 7, dolya_maks: 0.10}

poteri_pary_proc:            # [С 3.2] потери пары за бой, % от суммарного здоровья пары
  I: [8, 15]
  II: [5, 12]
  EL: [20, 35]
  BOSS: [30, 60]

poteri_geroya_maks_proc:     # [С 3.2] потери одного героя за бой, не больше, % его здоровья
  I: 25
  II: 25
  EL: 50

pobedy_min: 0.95             # [С 3.5]

vybor_v_raunde_min: 0.50     # [С 7.4] доля раундов, где у пары 2+ разных способа сыграть

vklad_geroya: [0.35, 0.65]   # [С 7.1]

razygrysh_za_raund: [5, 7]   # [С 5.5] карт за раунд на пару

shum:                        # [С 8.5] порог шума
  raundy: 0.3
  poteri: 1.5

serediina_koridora: 0.25     # [С 8.6] «посередине» — не дальше четверти ширины от центра

vragi_zdorove_maks:          # [С 4.1] здоровье врагов
  I: 20
  II: 20
  EL: 40

apgrejd_norma_proc: [70, 130]  # [С 8.9] сила апгрейда, % от силы эталонов
etalony: [etalon-uron, etalon-shchit]   # [С 8.8] «Искра очага +3 урона», «Оберег +3 щита»
redko_razygryvaetsya: 0.5    # [С 8.9] реже — «бот не раскрывает»
