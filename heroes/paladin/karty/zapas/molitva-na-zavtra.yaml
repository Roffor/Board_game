      kogda: nachalo
      vid_ocenki: faith
      ocenka_bota: 0.6 * vera_big
      effekt:
      - {vera: vera_big}
bot: {poryadok: 4, cennost: 5}
granicy: {vera: [0, 3], vera_big: [2, 6]}
